<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Página Inteira do Prime Video (Capturas em Etapas)</title>
<style>
  body { margin:0; padding:20px; font-family: Arial, sans-serif; }
  h1 { text-align:center; }
  .screenshots { display:flex; flex-direction:column; gap:20px; }
  .screenshot { text-align:center; }
  .screenshot img { max-width:100%; height:auto; border: 1px solid #ccc; }
</style>
</head>
<body>
<h1>Capturas de Tela da Prime Video (Topo, Meio, Final)</h1>
<div class="screenshots">
  <div class="screenshot">
    <h3>Topo (Header + Hero)</h3>
    <img src="screenshots/shot_top.png" alt="Topo">
  </div>
  <div class="screenshot">
    <h3>Meio (Conteúdo principal/rail)</h3>
    <img src="screenshots/shot_mid.png" alt="Meio">
  </div>
  <div class="screenshot">
    <h3>Final (Parte inferior)</h3>
    <img src="screenshots/shot_bottom.png" alt="Final">
  </div>
</div>
</body>
</html>
