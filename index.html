<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161f2a">
  <title>Play TV</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <!-- Tela de Bloqueio / Acesso Restrito -->
  <div id="lockScreen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-badge">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        <span>Área Restrita • Em Manutenção</span>
      </div>
      <div class="lock-header">
        <div class="lock-icon">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor" aria-hidden="true"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
        </div>
        <h2>Play TV</h2>
      </div>

      <form id="lockForm" class="lock-form" onsubmit="return false;">
        <div class="lock-field">
          <label for="lockUser">Usuário</label>
          <div class="lock-input-wrap">
            <span class="lock-input-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
            <input type="text" id="lockUser" class="lock-input" placeholder="Digite seu usuário" autocomplete="username" required autofocus>
          </div>
        </div>

        <div class="lock-field">
          <label for="lockPass">Senha</label>
          <div class="lock-input-wrap">
            <span class="lock-input-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg></span>
            <input type="password" id="lockPass" class="lock-input" placeholder="Digite sua senha" autocomplete="current-password" required>
            <button type="button" id="lockTogglePass" class="lock-toggle-pass" title="Ver senha" tabindex="-1">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
          </div>
        </div>

        <div class="lock-remember-row">
          <label class="lock-checkbox-label">
            <input type="checkbox" id="lockRemember" checked>
            <span>Lembrar meu acesso neste navegador</span>
          </label>
        </div>

        <div id="lockError" class="lock-error" hidden>Usuário ou senha incorretos.</div>

        <button type="submit" id="lockSubmit" class="lock-btn">
          <span>Acessar Player</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-7.85-1.42 1.42 5.43 5.43H5v2z"/></svg>
        </button>
      </form>
    </div>
  </div>

  <div class="app-shell" id="appShell" style="display:none">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" aria-hidden="true"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg></span> Play TV</div>
      <div class="top-actions">
        <div class="country-selector" id="countrySelector">
          <button class="country-btn" id="btnCountry" title="Selecionar País" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="country-flag" id="countryCurrentFlag"><img class="flag-icon" src="https://flagcdn.com/w40/br.png" srcset="https://flagcdn.com/w80/br.png 2x" width="22" height="16" alt="BR"></span>
            <span class="country-name" id="countryCurrentName">Brasil</span>
            <span class="country-caret">▾</span>
          </button>
          <div class="country-dropdown" id="countryDropdown" hidden>
            <div class="country-search-wrap">
              <input type="text" id="countrySearchInput" class="country-search-input" placeholder="Buscar país..." autocomplete="off">
            </div>
            <div class="country-list" id="countryList"></div>
          </div>
        </div>
        <button class="icon-btn" id="btnMenu" title="Menu"><svg viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
        <button class="icon-btn" id="btnSources" title="Fontes IPTV"><svg viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
        <button class="icon-btn" title="Notificações"><svg viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" aria-hidden="true"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg></button>
        <div class="avatar">JS</div>
      </div>
    </header>

    <main class="content">
      <section class="hero-grid">
        <div class="panel launches">
          <div class="panel-title"><span><svg viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" aria-hidden="true"><path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/></svg></span> Recentes</div>
          <div class="hero-card" id="heroCard">
            <button class="slide-arrow" id="prevSlide">‹</button>
            <div class="hero-copy">
              <span class="eyebrow" id="heroTag">Lançamento</span>
              <h2 id="heroTitle">Integração Shopee</h2>
              <p id="heroText">Conecte e gerencie sua loja virtual com ferramentas completas.</p>
              <div class="slider-dots" id="sliderDots"></div>
            </div>
            <div class="hero-art" id="heroArt"><svg viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" aria-hidden="true"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg></div>
            <button class="slide-arrow" id="nextSlide">›</button>
          </div>
        </div>

        <div class="panel highlights">
          <div class="panel-title"><span><svg viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" aria-hidden="true"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg></span> Favoritos</div>
          <div class="highlight-grid" id="highlightGrid"></div>
        </div>
      </section>

      <section class="toolbar">
        <div class="tabs" id="tabs"></div>
        <label class="search">
          <span>⌕</span>
          <input id="searchInput" placeholder="Buscar canal...">
        </label>
      </section>

      <section class="catalog" id="catalog"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script src="countries.js"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
