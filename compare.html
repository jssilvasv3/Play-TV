<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play TV — Comparação de Versões</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0c1117;
      color: #f1f5f9;
      padding: 16px;
    }
    h1 {
      text-align: center;
      margin-bottom: 16px;
      font-size: 1.5rem;
    }
    .comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .version {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      overflow: hidden;
      background: #161f2a;
    }
    .version-header {
      padding: 12px 16px;
      background: #1b2533;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .version-body {
      height: 600px;
      overflow: auto;
    }
    .version-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-main { background: #08a765; color: #fff; }
    .badge-back { background: #2196F3; color: #fff; }
    @media (max-width: 900px) {
      .comparison { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>Play TV — Comparação de Versões</h1>
  <div class="comparison">
    <div class="version">
      <div class="version-header">
        <span>Versão Principal (main)</span>
        <span class="badge badge-main">main</span>
      </div>
      <div class="version-body">
        <iframe src="index.html" title="Versão Principal"></iframe>
      </div>
    </div>
    <div class="version">
      <div class="version-header">
        <span>Versão Backup (play_tv2)</span>
        <span class="badge badge-back">play_tv2</span>
      </div>
      <div class="version-body">
        <iframe src="play_tv2/index.html" title="Versão Backup"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
